spring:
  datasource:
    url: jdbc:h2:mem:nexora;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
nexora:
  encryption-key: test-key-for-unit-tests
  upload-dir: ./target/test-uploads
  ollama:
    base-url: http://localhost:11434
    default-model: llama3.2
  search:
    provider: wikipedia
    searxng-url: http://localhost:8888
    brave-api-key: ""
